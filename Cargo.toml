[package]
name = "nexus-video-editor"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
authors = ["Fs1lyric"]
description = "A small, honest video editor: trim, arrange and export clips on a single timeline. Wraps ffmpeg."
license = "MIT"
repository = "https://github.com/Fs1lyric/nexus-video-editor"
readme = "README.md"

[lib]
name = "nexus"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "dep:rfd"]

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

eframe = { version = "0.28", optional = true, default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rfd = { version = "0.14", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
